name: RPM build
on:
  push:
  workflow_dispatch:
env:
  ARTIFACTORY_URL: https://rpmb.jfrog.io
  BINTRAY_USER: ${{ secrets.BINTRAY_USER }}
  BINTRAY_API_KEY: ${{ secrets.BINTRAY_API_KEY }}
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
  BINTRAY_REPO: php85custom
  SPEC_FILE: SPECS/php.spec
  RL9: 9.8.20260525.0
  RL9TAG: 9.8.20260525.0
  RL10: 10.2.20260525.0
  RL10TAG: 10.2.20260525.0
jobs:
  # PHASE 1 of the per-version pipeline: build RPMs (-> JFrog php85custom) and
  # the aursu/php85build:<os>-build base image that pear/extensions build FROM.
  # runtime/dev images moved to images.yaml — they install the PECL extensions
  # and must run AFTER the family rebuild, so they are driven by the orchestrator
  # (rpmbsys/rpmbuild-pipeline-php) which dispatches images.yaml when the family
  # is done. On master, the `notify` job kicks that orchestrator.
  test:
    runs-on: ubuntu-latest
    if: ${{ ! startsWith(github.ref_name, 'skip-rpm-') }}
    strategy:
      matrix:
        include:
          - compose-file: docker-compose.yml
            base: rocky10base
            build: rocky10build
            uploader: rocky10bintray
            repo_path: rocky/10
          - compose-file: docker-compose.RL9.yml
            base: rocky9base
            build: rocky9build
            uploader: rocky9bintray
            repo_path: rocky/9
    env:
      BUILD_COMPOSE_FILE: ${{ matrix.compose-file }}
      BASE: ${{ matrix.base }}
      BUILD: ${{ matrix.build }}
      UPLOADER: ${{ matrix.uploader }}
      REPO_PATH: ${{ matrix.repo_path }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: docker compose -f docker-compose.base.yml build --no-cache --pull $BASE
      - run: docker compose -f $BUILD_COMPOSE_FILE build --no-cache $BUILD
      - run: docker compose -f $BUILD_COMPOSE_FILE up --exit-code-from $BUILD $BUILD
      - run: docker compose -f rpmbuild/docker-compose.yml pull $UPLOADER
      - run: docker compose -f rpmbuild/docker-compose.yml run --rm -e BINTRAY_USER=$BINTRAY_USER -e BINTRAY_API_KEY=$BINTRAY_API_KEY -e BINTRAY_REPO=$BINTRAY_REPO -e ARTIFACTORY_URL=$ARTIFACTORY_URL -e REPO_PATH=$REPO_PATH $UPLOADER
  build:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: docker compose -f build/docker-compose.yml build --no-cache --pull
      - run: docker login -u $DOCKER_USER -p $DOCKER_PASS
      - run: docker compose -f build/docker-compose.yml push
  # Kick the ordered family + image pipeline once the base phase succeeds.
  notify:
    needs: [test, build]
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint scoped App token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: rpmbsys
          repositories: rpmbuild-pipeline-php
      - name: Trigger PHP 8.5 pipeline
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            // workflow_dispatch (needs Actions:write) rather than a
            // repository_dispatch (which would need Contents:write).
            const owner = 'rpmbsys';
            const repo = 'rpmbuild-pipeline-php';
            const { data: r } = await github.rest.repos.get({ owner, repo });
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'php-8.5.yml',
              ref: r.default_branch,
            });
